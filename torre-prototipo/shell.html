<script>
(function(){const H=document.documentElement;let q;try{q=new URLSearchParams(location.search)}catch(e){q={get:()=>null}}
let emb=q.get("embed")==="1";window.EMBED=emb;if(emb)H.dataset.embed="1";
let m="aberto";try{m=localStorage.getItem(emb?"torre-menu-embed":"torre-menu")||(emb?"fechado":"aberto")}catch(e){m=emb?"fechado":"aberto"}H.dataset.menu=m;
let t=window.TEMA_PADRAO||"claro";const qt=q.get("tema");if(qt==="claro"||qt==="escuro")t=qt;else if(!emb){try{t=localStorage.getItem("torre-tema")||t}catch(e){}}H.dataset.tema=t})();
__JS__
;(function(){const H=document.documentElement,b=document.getElementById("menu-tg");if(!b)return;
const sync=()=>{const ab=H.dataset.menu!=="fechado";b.setAttribute("aria-expanded",String(ab));const r=ab?"Esconder menu lateral":"Mostrar menu lateral";b.setAttribute("aria-label",r);b.title=r};
sync();b.addEventListener("click",e=>{e.stopPropagation();H.dataset.menu=H.dataset.menu==="fechado"?"aberto":"fechado";try{localStorage.setItem(window.EMBED?"torre-menu-embed":"torre-menu",H.dataset.menu)}catch(_){}sync()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&window.EMBED&&H.dataset.menu==="aberto"&&innerWidth<=900){H.dataset.menu="fechado";sync()}})})();
</script>
