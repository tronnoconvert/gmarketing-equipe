<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torre de Controle Escura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Torre de Controle · visual corporativo claro
   Layout: menu lateral sobre fundo cinza + "folha" branca com a visão do dia (KPIs com mini-gráficos, desempenho, pendências)
   e, abaixo, o Painel de Voo largo com sanfona. Violeta = ação; verde/âmbar/vermelho = estado. */
:root{color-scheme:light;
 --bg:#EEF0F4;--sheet:#FFFFFF;--fg:#14161C;--fg2:#3A3F4B;--muted:#6B7080;--faint:#9AA0AE;--line:#E6E8EE;--line-2:#D9DCE4;
 --fill:#1F2937;--fill-2:#111827;--ink:#111827;--soft:#EEF0F3;--a2:#64748B;--a3:#94A3B8;--a4:#8A5A3C;--a5:#B08A2E;--glow1:rgba(31,41,55,.14);
 --panel-solid:#FFFFFF;--panel-solid-2:#F7F8FA;--glass:#FFFFFF;--glass-2:#F4F5F8;--glass-hi:#ECEEF3;
 --good:#1F8A5B;--warn:#A06A00;--warn-f:#E8A33A;--bad:#C9362E;--bad2:#D9534F;
 --r:14px;--r-sm:10px;--font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --sh:0 1px 2px rgba(20,22,28,.04),0 1px 0 rgba(20,22,28,.02)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"cv11","ss01"}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;stroke-width:1.8}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);position:relative}
.lbl{font-size:.74rem;font-weight:600;color:var(--muted)}
/* ---- moldura ---- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;gap:0;padding:12px 12px 12px 0;padding-right:max(12px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;gap:6px;padding:6px 14px 6px max(14px,env(safe-area-inset-left,0px));overflow:auto;background:transparent;border:0;box-shadow:none}
.brand{display:flex;gap:10px;align-items:center;padding:8px 6px 14px;text-decoration:none;color:var(--fg)}
.brand-mk{width:30px;height:30px;border-radius:9px;background:var(--fg);display:grid;place-items:center}
.brand-mk .ic{color:#fff;width:17px;height:17px}
.brand b{font-weight:700;font-size:1rem;letter-spacing:-.01em}.brand small{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:700;color:#fff;background:var(--fill);padding:1px 7px;border-radius:999px;vertical-align:2px}
.ucard{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;box-shadow:var(--sh);margin-bottom:8px}
.me{display:flex;gap:10px;align-items:center}.me b{font-size:.86rem}.me small{display:block;color:var(--muted);font-size:.74rem}
.ucard select{width:100%;border-radius:8px;min-height:30px;font-size:.78rem;padding:4px 8px;background:var(--panel-solid-2)}
.nav{display:grid;gap:1px}
.nav a,.nav span{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--fg2);text-decoration:none;font-weight:500;font-size:.86rem}
.nav a .ic{color:var(--muted)}
.nav a:hover{background:rgba(20,22,28,.05)}
.nav a[aria-current]{background:var(--sheet);color:var(--fg);font-weight:600;box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.nav a[aria-current] .ic{color:var(--fill)}
.nav .cnt{margin-left:auto;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav a[aria-current] .cnt{color:var(--fill);font-weight:700}
.nav span{opacity:.55;cursor:not-allowed}
.nav .sec{font-size:.72rem;color:var(--faint);padding:16px 10px 4px;opacity:1;cursor:default;font-weight:500}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:10px 0 4px}
.rot{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;box-shadow:var(--sh);font-size:.78rem}
.rot b{font-size:.82rem}.rot .bar1{height:6px;border-radius:99px;background:var(--glass-hi);overflow:hidden}.rot .bar1 i{display:block;height:100%;background:var(--fill);border-radius:99px}
.main{min-width:0;display:grid;gap:0;align-content:start}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:20px;min-height:calc(100vh - 24px);box-shadow:0 1px 3px rgba(20,22,28,.05);min-width:0;display:grid;align-content:start}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:57;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:20px 20px 0 0}
.crumb{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}.crumb b{color:var(--fg);font-weight:600}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;gap:7px;align-items:center;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-size:.8rem;color:var(--fg2);background:var(--sheet)}
.ib.hamb{display:none}
#board{padding:22px;display:grid;gap:18px;min-width:0}
/* ---- controles ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--sheet);color:var(--fg);font-weight:600;font-size:.82rem;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s;text-decoration:none;box-shadow:0 1px 1px rgba(20,22,28,.04)}
.btn:hover{background:var(--panel-solid-2);border-color:#C9CDD8}
.btn.pri{background:var(--fill);border-color:var(--fill);color:#fff;box-shadow:0 1px 2px rgba(31,41,55,.25)}
.btn.pri:hover{background:var(--fill-2)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:#fff}
.btn.sm{min-height:28px;padding:0 10px;font-size:.76rem;border-radius:8px}
.btn.dis,.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--fill);color:var(--ink)}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;color:var(--fg2);position:relative}
.ib:hover{background:var(--panel-solid-2)}
.dot-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.ring-alert{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(201,54,46,.18)}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:600;font-size:.82rem;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fill)}
.tab .c{font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--glass-2);color:var(--fg2);font-weight:600}
.tab[aria-selected="true"] .c{background:var(--soft);color:var(--ink)}
.segt{display:inline-flex;padding:3px;gap:2px;border-radius:9px;background:var(--glass-2);border:1px solid var(--line)}
.segt .tab{border:0;margin:0;padding:4px 10px;border-radius:7px;font-size:.76rem}
.segt .tab[aria-selected="true"]{background:var(--sheet);box-shadow:var(--sh),0 0 0 1px var(--line);color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0;border:0;box-shadow:none;background:transparent}
.srch{position:relative;flex:1 1 220px;max-width:300px}
.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
input,select,textarea{background:var(--sheet);border:1px solid var(--line-2);border-radius:9px;min-height:34px;padding:6px 10px;color:var(--fg)}
.srch input{width:100%;padding-left:34px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(31,41,55,.3);outline-offset:0;border-color:var(--fill)}
.pp{display:inline-flex;gap:0;padding:2px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line)}
.pp button{border:0;background:none;border-radius:999px;padding:2px;cursor:pointer;opacity:.55}
.pp button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--fill)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:.68rem;font-weight:700;color:#fff;background:linear-gradient(140deg,var(--c1,#888),var(--c2,#333));flex:none}
.av.sm{width:22px;height:22px;font-size:.58rem}.av.lg{width:52px;height:52px;font-size:1rem;border-radius:14px}
.pop{position:absolute;z-index:60;min-width:260px;max-height:60vh;overflow:auto;padding:12px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(20,22,28,.14)}
.pop h4{margin:10px 0 4px;font-size:.72rem;font-weight:600;color:var(--muted)}
.pop label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:.82rem;cursor:pointer}
.rel{position:relative}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:.78rem}
/* ---- pílulas ---- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--glass-2);color:var(--fg2);border:1px solid transparent}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill.ok{background:#E7F5EE;color:#17704A}.pill.ok i{background:var(--good)}
.pill.warn{background:#FDF3E1;color:#8A5B00}.pill.warn i{background:var(--warn-f)}
.pill.bad{background:#FCEBEA;color:#A62A23}.pill.bad i{background:var(--bad)}
.pill.acc{background:var(--soft);color:var(--ink)}.pill.acc i{background:var(--fill)}
.sem i{width:8px;height:8px}
.s-exc,.s-bom{background:#E7F5EE;color:#17704A}.s-exc i{background:var(--good)}.s-bom i{background:transparent;border:2px solid var(--good)}
.s-aten{background:#FDF3E1;color:#8A5B00}.s-aten i{background:var(--warn-f)}
.s-caro{background:#FCEDF2;color:#A3284F}.s-caro i{background:transparent;border:2px solid var(--bad2)}
.s-crit{background:#FCEBEA;color:#A62A23}.s-crit i{background:var(--bad);box-shadow:0 0 0 3px rgba(201,54,46,.18)}
.s-par i{background:var(--fg2);border-radius:2px}.s-sem i{background:transparent;border:2px solid var(--a4)}.s-ins i{background:transparent;border:1.5px dashed var(--a4)}
.up{color:var(--good)}.dn{color:var(--bad)}
.var{display:inline-flex;align-items:center;gap:3px;font-size:.74rem;font-weight:700}
/* ---- visão do dia ---- */
.hello{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.hello h1{margin:0;font-size:1.65rem;font-weight:700;letter-spacing:-.025em}
.hello p{margin:4px 0 0;color:var(--muted)}
.k4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kx{background:var(--panel-solid-2);border:1px solid var(--line);border-radius:14px;padding:4px;display:grid}
.kx-h{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:.82rem;font-weight:600;color:var(--fg2)}
.kx-h .ic{color:var(--muted)}
.kx-b{background:var(--sheet);border:1px solid var(--line);border-radius:11px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end;min-height:100px}
.kx-v{font-size:2rem;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kx-v small{font-size:1rem;color:var(--muted);font-weight:600}
.kx-s{font-size:.74rem;color:var(--muted);margin-top:8px;white-space:nowrap}
.mb{width:100%;height:52px;display:block}
.ovg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.ovl,.ovr{display:grid;gap:14px;min-width:0}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px;flex-wrap:wrap}
.cardh h3{margin:0;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.perf{position:relative;padding:0 10px 10px}
.perf svg{width:100%;height:auto;display:block}
.ptip{position:absolute;pointer-events:none;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(20,22,28,.12);padding:8px 10px;font-size:.76rem;display:grid;gap:3px;min-width:170px;z-index:3}
.ptip b{font-size:.78rem}.ptip span{display:flex;align-items:center;gap:6px}.ptip em{font-style:normal;margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;padding-left:14px}
.ptip i{width:8px;height:8px;border-radius:2px}
.lgd{display:flex;gap:16px;font-size:.76rem;color:var(--muted);padding:0 16px}.lgd span{display:flex;gap:6px;align-items:center}.lgd i{width:10px;height:3px;border-radius:2px}
.gst{display:grid;gap:10px;padding:8px 12px 12px}
.gs{background:var(--panel-solid-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%}
.gs:hover{border-color:var(--line-2)}
.gs[aria-pressed="true"]{border-color:var(--fill);background:var(--soft)}
.gs-t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.86rem}
.gs-p{font-size:1.45rem;font-weight:700;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gs-m{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.gs-m b{color:var(--fg)}
.prog{height:6px;border-radius:99px;background:var(--glass-hi);overflow:hidden;display:flex}
.prog i{display:block;height:100%;background:var(--fill)}.prog i.late{background:var(--bad2)}
.alc{border-radius:16px;padding:20px;display:grid;justify-items:center;text-align:center;gap:8px;background:linear-gradient(160deg,#F4F5F7 0%,#ECEEF1 100%);border:1px solid #E2E5EA}
.alc .ico{width:44px;height:44px;border-radius:12px;background:var(--fg);display:grid;place-items:center;color:#fff}
.alc h3{margin:4px 0 0;font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.alc p{margin:0;font-size:.8rem;color:var(--fg2);max-width:30ch}
.alc .btn{width:100%;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:6px 16px 16px}
.tile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet);cursor:pointer;text-align:left;padding:0;display:grid}
.tile:hover{border-color:var(--line-2)}
.tile-a{height:86px;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--t-bg)}
.tile-a b{font-size:2rem;font-weight:700;letter-spacing:-.03em;color:var(--t-fg)}
.tile-a .ico{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--t-fg);box-shadow:0 4px 12px rgba(20,22,28,.08)}
.tile-b{padding:10px 14px 12px;display:grid;gap:2px}.tile-b strong{font-size:.86rem}.tile-b span{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- quadro ---- */
.sec-board{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
.board{padding:0;overflow:hidden;border-radius:12px;box-shadow:none}
.tw{position:relative;max-height:calc(100vh - 90px);min-height:340px;overflow:auto;border-radius:12px}
.tw-sh{position:absolute;top:0;right:0;bottom:0;width:30px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(20,22,28,.09));opacity:0;transition:opacity .2s;z-index:5}
.board.more .tw-sh{opacity:1}
table.q{border-collapse:separate;border-spacing:0;font-size:.8rem;min-width:100%}
.q th,.q td{padding:0 12px;height:44px;white-space:nowrap;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.q thead th{position:sticky;background:var(--panel-solid-2);z-index:3;font-weight:600;color:var(--muted)}
.q thead tr.g th{top:0;height:28px;font-size:.7rem;color:var(--ink);font-weight:700;border-left:1px solid var(--line);background:#F1F3F6}
.q thead tr.h th{top:28px;height:36px;font-size:.74rem;cursor:pointer;user-select:none}
.q thead tr.h th:hover{color:var(--fg)}
.q th.n,.q td.n{text-align:right;font-variant-numeric:tabular-nums}
.q .fix{position:sticky;left:0;z-index:2;background:var(--sheet);min-width:250px;max-width:250px;box-shadow:1px 0 0 var(--line),6px 0 12px -8px rgba(20,22,28,.18)}
.q thead .fix{z-index:4;background:var(--panel-solid-2)}.q thead tr.g .fix{background:#F1F3F6}
.q tbody tr.r{cursor:pointer}
.q tbody tr.r:hover td{background:#FAFAFC}
.q tbody tr.r.open td{background:#F3F4F6}
.cl{display:flex;gap:10px;align-items:center;min-width:0}
.cl b{display:block;font-weight:600;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.cl small{color:var(--muted);font-size:.7rem}
.chev{transition:transform .18s;color:var(--faint)}tr.open .chev{transform:rotate(90deg);color:var(--fill)}
.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.tgrp td{background:var(--panel-solid-2)!important;height:34px;font-weight:700;font-size:.78rem}
.mini{color:var(--muted);font-size:.7rem;display:block}
.cp{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:2px 8px;font-size:.7rem;font-weight:600;cursor:pointer;margin-left:6px}
.cp:hover{background:var(--panel-solid-2)}
.tipbox{position:fixed;z-index:90;max-width:340px;padding:9px 11px;border-radius:9px;background:var(--fg);color:#fff;font-size:.76rem;line-height:1.5;box-shadow:0 12px 30px rgba(20,22,28,.25);pointer-events:none;white-space:pre-wrap}
.acc td{padding:0!important;height:auto!important;white-space:normal;background:#FAFAFC!important}
.acc-in{position:sticky;left:0;padding:18px;display:grid;gap:14px;border-left:3px solid var(--fill)}
.cards{display:none}
/* ---- conta ---- */
.ch{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 20px}
.ch h2{margin:0;font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:700;letter-spacing:-.025em;line-height:1.1}
.ch .lbl{font-size:.74rem}
.ch .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.78rem;margin-top:6px}
.ch .meta code{font-family:ui-monospace,Menlo,monospace;color:var(--fg2);font-size:.74rem}
.ch-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.per{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.per .tab{border:1px solid var(--line);border-radius:999px;margin:0;padding:5px 11px;background:var(--sheet)}
.per .tab[aria-selected="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.per input[type=date]{min-height:30px;font-size:.76rem}
.k1{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1400px){.k1{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.k1{grid-template-columns:repeat(2,minmax(0,1fr))}.kc-v{font-size:1.2rem}}
.kc{padding:14px 14px 14px 16px;display:grid;gap:8px;overflow:hidden}
.kc::after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--kc)}
.kc-t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kc-t .lbl{font-weight:600}

   Valores de fábrica abaixo = catálogo agencia-os/src/core/padroes/trafego.js (ids 'torre.*' e 'orcamento.*').
   Embutida: a janela-mãe envia {tipo:'padroes', valores:{id:valor}} ao carregar e quando o dono/Head muda um padrão.
   Isolada: localStorage 'torre-padroes'. Concatenado ANTES de data.js (o semáforo é calculado na carga). */
const PADROES_FABRICA={
 'torre.semaforo.excelente':.75,'torre.semaforo.bom':1,'torre.semaforo.atencao':1.25,'torre.semaforo.caro':1.5,

/* ===== Guardião de segurança (possível invasão) na Torre =====
   Motor: Guardiao (agencia-os/src/shared/guardiao.js, concatenado antes de ov.js). Este arquivo liga o motor às contas da Torre:
   simulação de invasão (demonstração), pausa automática de TODAS as campanhas ativas (nunca exclui), quarentena (linha/cartão
   preto-vermelho), painel do incidente, vigilância a cada 4 s (reativação → pausa de novo + "reincidência") e saída da quarentena
   (Dono/Admin + SIM + checklist + reativação seletiva com o orçamento de antes do incidente).
   Modo embutido: avisa o Agência OS por postMessage {tipo:'invasao', evento, incidente} (lá tocam a sirene e o banner para todos);
   recebe {tipo:'usuario'}, {tipo:'guardiaoRegras'}, {tipo:'guardiaoSync'} e {tipo:'guardiaoLiberar'}. Isolada: sirene local. */
var GT={est:{},inc:{},regras:{},papel:null,sir:null,sirOn:false,ultimo:null};
function gtLer(){try{const s=JSON.parse(localStorage.getItem('torre-guardiao')||'null');if(s&&!window.EMBED){GT.est=s.est||{};GT.inc=s.inc||{}}}catch(e){}}
function gtSalvar(){if(window.EMBED)return;try{localStorage.setItem('torre-guardiao',JSON.stringify({est:GT.est,inc:GT.inc}))}catch(e){}}
function gtQ(a){const e=GT.est[a.id];return !!(e&&e.quarentena)}
function gtPapel(){if(window.EMBED&&GT.papel)return GT.papel;return ['gabriel','rayane'].includes(S.user)?(S.user==='gabriel'?'dono':'admin'):S.user==='alan'?'gestor_trafego':'leitura'}
const gtDonoAdmin=()=>['dono','admin'].includes(gtPapel());
function gtSnap(a){return Guardiao.adaptadores.torre(a,{agora:NOW().getTime(),autorizados:TEAM.map(t=>t.id),eventos:a.eventosSeg||[],gastoHoras:a.gastoHoras||null})}
function gtCamp(a,id){return a.camps.find(c=>String(c.id)===String(id))}
function gtNo(a,id){for(const c of a.camps){if(String(c.id)===String(id))return c;for(const s of c.sets)if(String(s.id)===String(id))return s}return null}

function gtVerificar(a,o={}){

  const {c,s,d}=nodeOf(a,r.alvo),x=d||s||c;
  if(r.tipo==='budget'){const usados=limite(r.alvo),LIM=PD('orcamento.maxMudancasHora');if(usados.length>=LIM)return toast(`${ic('lock')}<span>Limite de alterações: ${LIM} mudança${LIM===1?'':'s'} de orçamento por conjunto por hora já atingido.</span>`);const old=x.orc;executar(a,{acao:`Orçamento diário (${r.titulo.toLowerCase()})`,onde:`${a.nome} · ${x.nome}`,antes:brl2(old)+'/dia',depois:brl2(r.para)+'/dia',via:'IA',avisos:invHTML(a,r.alvo,r.para)+((r.para-old)/old*100>PD('orcamento.aumentoMaxPct')?`<div class="warnb">Aumento acima de ${dec(PD('orcamento.aumentoMaxPct'),0)}%.</div>`:''),fazer:()=>{x.orc=r.para;r.status='feita';logRec(a,r,'aceita');(BL[r.alvo]=BL[r.alvo]||[]).push(NOW().getTime())},desfazer:()=>{x.orc=old;r.status='aberta'}})}
  if(r.tipo==='pause'){const old=x.status;executar(a,{acao:r.titulo,onde:`${a.nome} · ${x.nome}`,antes:old,depois:'Pausada',via:'IA',fazer:()=>{x.status='Pausada';r.status='feita';logRec(a,r,'aceita')},desfazer:()=>{x.status=old;r.status='aberta'}})}
  },
 'rec-ajustar':b=>{const a=conta(b.dataset.a),r=a.recs.find(x=>x.id===+b.dataset.r);if(!podeExec(a)[0])return toast(`${ic('lock')}<span>${esc(podeExec(a)[1])}</span>`);
  if(r.tipo==='budget'){modalOrcamento(a,r.alvo,r.para,'IA (ajustada)');return}const {c,s,d}=nodeOf(a,r.alvo);
  if(r.tipo==='publico'){abrirPublico(a,s,null,r);return}
  if(r.tipo==='pause'){S.tab='campanhas';S.exp.add(c.id);if(s)S.exp.add(s.id);render();toast('Abri a aba Campanhas no item recomendado para você escolher o que pausar.')}},
 'rec-recusar':b=>{const a=conta(b.dataset.a),r=a.recs.find(x=>x.id===+b.dataset.r);if(!podeExec(a)[0])return toast(`${ic('lock')}<span>${esc(podeExec(a)[1])}</span>`);r.status='recusada';logRec(a,r,'recusada');AUD.push({conta:a.id,quem:S.user,quando:NOW(),oque:'Recusou recomendação da IA: '+r.titulo,onde:a.nome,antes:'Aberta',depois:'Recusada',via:'IA'});render();const t=toast(`<span>Recomendação recusada. Ela não volta a aparecer esta semana.</span><button>Desfazer</button>`);t.querySelector('button').onclick=()=>{r.status='aberta';render();t.remove()}},
};
function abrirPublico(a,s,sug,rec){formModal(a,'Público do conjunto',[{id:'min',l:'Idade mínima',v:String(sug?sug.min:s.publico.min),im:'numeric',val:(v,all)=>!/^\d+$/.test(v)||+v<18||+v>65?'Use uma idade entre 18 e 65.':+v>=+all.max?'A idade mínima precisa ser menor que a máxima.':''},{id:'max',l:'Idade máxima',v:String(sug?sug.max:s.publico.max),im:'numeric',val:v=>!/^\d+$/.test(v)||+v<18||+v>65?'Use uma idade entre 18 e 65 (65 = 65 ou mais).':''},{id:'locais',l:'Locais',v:s.publico.locais,val:v=>!v?'Informe pelo menos um local.':''},{id:'interesses',l:'Interesses',v:s.publico.interesses,h:'Separe por vírgula.'}],v=>{const o={...s.publico},n={min:+v.min,max:+v.max,locais:v.locais,interesses:v.interesses};executar(a,{acao:'Editar público do conjunto',onde:`${a.nome} · ${s.nome}`,antes:`${o.min}–${o.max} anos · ${o.locais}`,depois:`${n.min}–${n.max} anos · ${n.locais}`,via:rec?'IA (ajustada)':'',fazer:()=>{s.publico=n;if(rec)rec.status='feita'},desfazer:()=>{s.publico=o;if(rec)rec.status='aberta'}})})}

Object.assign(ACT,window.__extraActs||{});
/* ===== sininho e som ===== */
let AC=null,beepT=null;
function beep(){if(!AC)return;[0,.22].forEach(o=>{const t=AC.currentTime+o,os=AC.createOscillator(),g=AC.createGain();os.type='sine';os.frequency.value=880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);os.connect(g).connect(AC.destination);os.start(t);os.stop(t+.2)})}
function alarme(){const crit=recebeAlertas()?NOTIF.filter(x=>x.sev==='crit'&&!x.visto):[];const al=$('#alarm');
 if(crit.length){al.hidden=false;al.innerHTML=`${ic('alert')}<span style="flex:1"><b>${crit.length} alerta${crit.length>1?'s':''} crítico${crit.length>1?'s':''}.</b> ${esc(conta(crit[0].conta).nome)}: ${esc(crit[0].txt)}</span><button class="btn sm" data-act-al="ver" data-c="${crit[0].conta}">Abrir conta</button><button class="btn sm pri" data-act-al="ciente">Vi / Ciente</button>`;
  if(S.sound&&!beepT){beep();beepT=setInterval(beep,2600)}}else{al.hidden=true;clearInterval(beepT);beepT=null}}
function bellHTML(){if(!recebeAlertas())return `<div class="bellp"><b>Alertas</b><p class="hint">Os alertas automáticos vão para o Alan (Head de Tráfego) e para os Admins, só quando uma conta performa mal, um dado fica crítico ou acontece uma surpresa. Você vê tudo direto no quadro.</p></div>`;
 return `<div class="bellp"><div class="row" style="justify-content:space-between"><b>Alertas para ${ME().nome}</b>${S.sound?`<span class="pill ok"><i></i>Som ativado</span>`:`<button class="btn sm pri" data-act-al="som">${ic('vol')}Ativar alertas sonoros</button>`}</div><p class="hint">Só chega alerta quando a conta performa mal, um dado fica crítico ou há uma surpresa. Mudanças normais não notificam.</p>${NOTIF.map(n=>`<div class="nt ${n.sev} ${n.visto?'seen':''}"><div class="row" style="justify-content:space-between"><span class="pill ${n.sev==='crit'?'bad':'warn'}"><i></i>${n.sev==='crit'?'Crítico':'Atenção'}</span><small class="hint">${n.hora}</small></div><b>${esc(conta(n.conta).nome)}</b><span>${esc(n.txt)}</span><div class="row"><button class="btn sm" data-act-al="ver" data-c="${n.conta}">Abrir conta</button>${n.visto?'':`<button class="btn sm pri" data-act-al="visto" data-n="${n.id}">Vi / Ciente</button>`}</div></div>`).join('')}<button class="btn sm" data-act-al="simular">${ic('alert')}Simular novo alerta crítico</button></div>`}

/* ===== abrir/fechar conta ===== */
function garantirVisivel(id){if(id&&!linhas().some(a=>a.id===id)){S.view='principal';S.q='';S.pessoas.clear();S.fSem=S.fOp=S.fRev='todos'}}
function abrir(id){if(id===S.open)id=null;garantirVisivel(id);S.open=id;S.tab='painel';const h=id?'c-'+id:'quadro';if(location.hash!=='#'+h){try{history.replaceState(null,'','#'+h)}catch(_){location.hash=h}}render();
 if(id&&!mobile()){const r=$(`tr.r[data-open="${id}"]`),tw=$('.tw');if(r&&tw){tw.scrollTop=r.offsetTop-76}}}
/* ===== eventos ===== */
function boot(){
 document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('[data-stop]')&&!t.closest('[data-act]'))return;
  const pal=t.closest('[data-pal-set]');if(pal){S.pal=pal.dataset.palSet;try{localStorage.setItem('glass-pal',S.pal)}catch(_){}render();return}
  const al=t.closest('[data-act-al]');if(al){const k=al.dataset.actAl;
   if(k==='som'){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();S.sound=true;beep();toast(`${ic('vol')}<span>Alertas sonoros ativados. Alertas críticos tocam até você clicar em “Vi / Ciente”.</span>`)}catch(_){toast('Este navegador bloqueou o som. Os alertas continuam aparecendo na tela.')}S.bell=false;render();alarme();bellRender();return}
   if(k==='ciente'){NOTIF.forEach(n=>{if(n.sev==='crit')n.visto=true});alarme();render();bellRender();toast(`${ic('check')}<span>Alertas críticos marcados como vistos às ${hm(NOW())}.</span>`);return}
   if(k==='visto'){NOTIF.find(n=>n.id===+al.dataset.n).visto=true;alarme();render();bellRender();return}
   if(k==='ver'){S.bell=false;bellRender();S.view='principal';abrir(+al.dataset.c);return}
   if(k==='simular'){NOTIF.unshift({id:Date.now(),sev:'crit',conta:8,txt:'Surpresa: nenhuma conversa nas últimas 6 horas com gasto normal. Possível problema no número do WhatsApp.',hora:hm(NOW()),visto:false});alarme();render();bellRender();return}}
  if(t.closest('#bell')){S.bell=!S.bell;bellRender();return}
  if(S.bell&&!t.closest('.bellp')){S.bell=false;bellRender()}
  const a=t.closest('[data-act]');if(a){e.preventDefault();if(a.classList.contains('dis')){toast(`${ic('lock')}<span>${esc(a.dataset.tip||'Sem permissão.')}</span>`);return}ACT[a.dataset.act]&&ACT[a.dataset.act](a);return}
  const pop=t.closest('[data-pop]');if(pop){S.pop=pop.dataset.pop&&S.pop!==pop.dataset.pop?pop.dataset.pop:null;render();return}
  if(S.pop&&!t.closest('.pop')){S.pop=null;render()}
  const v=t.closest('[data-view]');if(v){e.preventDefault();S.cad=false;S.view=v.dataset.view;S.open=null;history.replaceState(null,'','#quadro');$('#side').classList.remove('open');render();return}
  const pe=t.closest('[data-pessoa]');if(pe){const g=pe.dataset.pessoa;S.pessoas.has(g)?S.pessoas.delete(g):S.pessoas.add(g);render();return}
  const so=t.closest('th[data-sort]');if(so){const k=so.dataset.sort;if(S.sortCol===k)S.sortDir=-S.sortDir;else{S.sortCol=k;S.sortDir=-1}render();return}
  const tb=t.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();return}
  const pr=t.closest('[data-per]');if(pr){S.per=pr.dataset.per;render();return}
  const dy=t.closest('[data-daily]');if(dy){S.daily=dy.dataset.daily;render();return}
  const ex=t.closest('[data-exp]');if(ex){const id=+ex.dataset.exp;S.exp.has(id)?S.exp.delete(id):S.exp.add(id);render();return}
  const op=t.closest('[data-open]');if(op&&!t.closest('.acc-in')){abrir(+op.dataset.open);return}
  if(t.closest('#hamb')){$('#side').classList.toggle('open');return}
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)return fecharModal();if(S.bell){S.bell=false;return bellRender()}if(S.pop){S.pop=null;return render()}if(S.open)abrir(null);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.r,.cd')){e.preventDefault();abrir(+e.target.dataset.open)}});
 document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){S.q=t.value;const p=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}});
 document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='ord'){S.ord=t.value;S.sortCol=null;render()}if(t.id==='grp'){S.group=t.value;render()}
  if(t.id==='f-sem'){S.fSem=t.value;render()}if(t.id==='f-op'){S.fOp=t.value;render()}if(t.id==='f-rev'){S.fRev=t.value;render()}
  if(t.dataset.col){t.checked?S.hidden.delete(t.dataset.col):S.hidden.add(t.dataset.col);render()}
  if(t.name==='co'){S.colOrder=t.value;render()}
  if(t.id==='user'){S.user=t.value;S.view=['vitor','vinicius'].includes(S.user)?'meus':'principal';S.pessoas.clear();render();alarme();bellRender();toast(`${ic('users')}<span>Agora você vê como <b>${ME().nome}</b> (${ME().papel}). ${ME().exec==='all'?'Pode executar em todas as contas.':ME().exec==='own'?'Executa só nas contas dele; abriu em “Meus clientes”.':'Só leitura: vê tudo, não executa nada.'}</span>`)}
  if(t.id==='d-from'||t.id==='d-to'){const f=new Date($('#d-from').value+'T00:00'),to=new Date($('#d-to').value+'T00:00');if(isNaN(f)||isNaN(to)||f>to){toast('A data inicial precisa ser anterior à final.');return}S.per='custom';S.from=f;S.to=to;render()}});
 let tip=$('#tip');document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el)return;tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect();const w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';const y=r.bottom+8+tip.offsetHeight>innerHeight?r.top-tip.offsetHeight-8:r.bottom+8;tip.style.top=y+'px'});
 document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.hidden=true});
 ['click','scroll','keydown'].forEach(ev=>document.addEventListener(ev,()=>{tip.hidden=true},true));
 new ResizeObserver(()=>{const w=accW();$$('.acc-in').forEach(x=>x.style.width=w+'px');sombra()}).observe(document.body);
 let wasMobile=mobile();addEventListener('resize',()=>{if(mobile()!==wasMobile){wasMobile=mobile();render()}});
 window.addEventListener('hashchange',()=>{if(location.hash==='#cadastro'){if(!S.cad){S.cad=true;render()}return}const m=location.hash.match(/^#c-(\d+)$/);const id=m?+m[1]:null;if(id!==S.open){S.open=id&&conta(id)?id:null;garantirVisivel(S.open);S.tab='painel';render()}});
 if(location.hash==='#cadastro')S.cad=true;const m=location.hash.match(/^#c-(\d+)$/);if(m&&conta(m[1]))S.open=+m[1];garantirVisivel(S.open);
 $('#user').innerHTML=TEAM.map(t=>`<option value="${t.id}">${t.nome} · ${t.papel}</option>`).join('');
 render();alarme();
}
